<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Challenge v1.0.4</title>
    <style>
        /* --- PIXEL RESET & GLOBAL CORE STYLE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            image-rendering: pixelated; /* Forces retro pixel graphics to stay sharp */
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #ffdbe4; /* Cohesive pastel pink theme backup color */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background 1s ease;
            /* Applies your custom original cursor across the entire screen layout */
            cursor: url('cursor.webp'), auto;
        }

        /* --- GLOBAL STEADY VISUAL ASSET LAYERS --- */
        #bg-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('math-bg.webp');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            pointer-events: none;
            z-index: 1;
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
            display: none;
        }

        /* --- ANIMATED FLOATING BACKGROUND MINI-ELEMENTS --- */
        .bg-element {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            max-width: 90px;
            height: auto;
        }

        .bg-cat {
            bottom: 8%;
            right: 8%;
            animation: gentleFloat 4s ease-in-out infinite;
        }

        .bg-cherry {
            top: 8%;
            left: 8%;
            animation: gentleFloat 5s ease-in-out infinite alternate;
        }

        @keyframes gentleFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* --- STAGE 1: MATH INTERACTIVE PANEL --- */
        #game-screen {
            text-align: center;
            max-width: 500px;
            width: 90%;
            padding: 35px 25px;
            background: rgba(255, 219, 228, 0.88); /* Translucent glass pastel pink panel */
            border: 5px solid #ea6b94; /* Vivid pixel-art pink outline */
            box-shadow: 6px 6px 0px #ba486b; /* Hard chunky retro shadow mapping */
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #000000; /* Crisp black text matching your criteria */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .math-box {
            font-size: 3.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #000000; /* Bold black equation display */
            text-shadow: 2px 2px 0px #ffffff;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            font-size: 1.6rem;
            text-align: center;
            background-color: #ffffff; /* Clean high-contrast white input core */
            border: 4px solid #ea6b94;
            color: #000000; /* Input text rendering black */
            margin-bottom: 25px;
            outline: none;
            font-weight: bold;
        }

        .input-field:focus {
            background-color: #fff0f3;
            border-color: #ba486b;
        }

        /* CUSTOM ORIGINAL GRAPHIC SUBMIT ACTION MATRICES */
        .custom-submit-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: url('cursor.webp'), auto;
            width: 100%;
            max-width: 260px;
            transition: transform 0.05s;
            display: inline-block;
        }

        .custom-submit-btn img {
            width: 100%;
            height: auto;
            display: block;
        }

        .custom-submit-btn:active {
            transform: scale(0.96) translateY(2px);
        }

        /* TIMED STALL INTERFACE FOR TRICK ROUND */
        #loading-container {
            display: none;
            margin-top: 20px;
        }

        .loading-alert-text {
            margin-bottom: 10px; 
            font-size: 0.95rem; 
            color: #000000; 
            font-weight: bold;
        }

        .progress-bar-bg {
            width: 100%;
            height: 28px;
            border: 4px solid #ea6b94;
            background: #ffffff;
            padding: 2px;
            position: relative;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background-color: #ea6b94;
            transition: width 0.3s ease;
        }

        #progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 1rem;
            color: #000000;
            mix-blend-mode: difference; /* Keeps percentage text visible as bar crosses it */
        }

        /* --- STAGE 2: PINK ERROR BLOCK SYSTEM FAILURE --- */
        #crash-screen {
            display: none;
            width: 100%;
            height: 100%;
            padding: 40px;
            text-align: left;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #ffd6e0; /* Custom soft pink "Blue Screen of Death" replacement */
            z-index: 20;
            overflow-y: auto;
        }

        .bsod-title {
            background-color: #ea6b94;
            color: #ffffff; /* Crisp white headers */
            display: inline-block;
            padding: 6px 14px;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.3rem;
            border: 3px solid #000000;
        }

        .bsod-text {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #000000; /* Informational diagnostic strings tracking black */
            font-weight: bold;
        }

        .bsod-btn-wrapper {
            max-width: 280px;
        }

        /* --- STAGE 3: THE ORIGINAL HARMONIOUS WINDOW POPUP --- */
        #reveal-screen {
            display: none;
            width: 440px;
            max-width: 95%;
            background-color: #fce1e8; /* Exact original system palette tone match */
            border: 6px solid #f29cb7;
            padding: 0;
            box-shadow: 0 12px 40px rgba(234, 107, 148, 0.4);
            animation: windowPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
        }

        @keyframes windowPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .window-header {
            background-color: #fcaec6;
            height: 44px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 6px solid #f29cb7;
        }

        .header-decorations {
            display: flex;
            gap: 6px;
        }

        .decor-dot {
            width: 12px;
            height: 12px;
            background-color: #e590af;
            border-radius: 2px;
        }
        .decor-dot:nth-child(2) { background-color: #dca3cb; }
        .decor-dot:nth-child(3) { background-color: #ffffff; }
