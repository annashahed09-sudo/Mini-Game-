<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURPRISE</title>
    <style>
       
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            image-rendering: pixelated; 
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #ffdbe4; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background 1s ease;
            cursor: url('cursor.webp'), auto;
        }

        #bg-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('math-bg.webp');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            pointer-events: none;
            z-index: 1;
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
            display: none;
        }

        .bg-element {
            position: absolute;
            pointer-events: none;
            z-index: 2; 
            width: 110px; 
            height: auto;
        }

        .bg-cat {
            bottom: 15%; 
            right: 12%; 
            animation: gentleFloat 4s ease-in-out infinite;
        }

        .bg-cherry {
            top: 15%;  
            left: 12%;
            animation: gentleFloat 5s ease-in-out infinite alternate;
        }

        @keyframes gentleFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        #game-screen {
            text-align: center;
            max-width: 500px;
            width: 90%;
            padding: 40px 30px;
            background: #ffffff; 
            border: 6px solid #ea6b94; 
            box-shadow: 8px 8px 0px #ba486b; 
            z-index: 10;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #000000;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .math-box {
            font-size: 2.5rem; 
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #000000;
            white-space: nowrap; 
        }

        .input-field {
            width: 100%;
            padding: 14px;
            font-size: 1.6rem;
            text-align: center;
            background-color: #ffffff;
            border: 4px solid #ea6b94; 
            color: #000000;
            margin-bottom: 25px;
            outline: none;
            font-weight: bold;
        }

        .input-field:focus {
            background-color: #fff0f3;
            border-color: #ba486b;
        }

        .custom-submit-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: url('cursor.webp'), auto;
            width: 100%;
            max-width: 260px;
            transition: transform 0.05s;
            display: inline-block;
        }

        .custom-submit-btn img {
            width: 100%;
            height: auto;
            display: block;
        }

        .custom-submit-btn:active {
            transform: scale(0.96) translateY(2px);
        }

        #loading-container {
            display: none;
            margin-top: 20px;
        }

        .loading-alert-text {
            margin-bottom: 10px; 
            font-size: 0.95rem; 
            color: #000000; 
            font-weight: bold;
        }

        .progress-bar-bg {
            width: 100%;
            height: 28px;
            border: 4px solid #ea6b94;
            background: #ffffff;
            padding: 2px;
            position: relative;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background-color: #ea6b94;
            transition: width 0.3s ease;
        }

        #progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 1rem;
            color: #000000;
            mix-blend-mode: difference;
        }

        #crash-screen {
            display: none;
            width: 100%;
            height: 100%;
            padding: 40px;
            background-color: #ffffff; 
            z-index: 20;
            overflow-y: auto;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center; 
        }

        .bsod-title {
            background-color: #ea6b94;
            color: #ffffff;
            display: inline-block;
            padding: 6px 14px;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.3rem;
            border: 3px solid #000000;
        }

        .bsod-text {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #000000;
            font-weight: bold;
            max-width: 750px;
        }

        .bsod-btn-wrapper {
            width: 100%;
            max-width: 260px;
            display: flex;
            justify-content: center;
        }

        #reveal-screen {
            display: none;
            width: 440px;
            max-width: 95%;
            background-color: #ffffff; 
            border: 6px solid #ea6b94; 
            box-shadow: 0 12px 40px rgba(234, 107, 148, 0.4);
            animation: windowPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
        }

        @keyframes windowPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .window-header {
            background-color: #ffdbe4; 
            height: 44px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 6px solid #ea6b94;
        }

        .header-decorations {
            display: flex;
            gap: 6px;
        }

        .decor-dot {
            width: 12px;
            height: 12px;
            background-color: #e590af;
            border-radius: 2px;
        }
        .decor-dot:nth-child(2) { background-color: #dca3cb; }
        .decor-dot:nth-child(3) { background-color: #ffffff; }
        .close-button-x { font-weight: bold; color: #e590af; font-size: 1.4rem; }
        .window-content { padding: 25px 20px; text-align: center; }
        .love-headline { font-size: 2.5rem; font-weight: bold; color: #ea6b94; margin-bottom: 25px; letter-spacing: 1px; text-shadow: 2px 2px 0px #ffdbe4; }
        .bouquet-frame { max-width: 180px; width: 80%; margin: 0 auto 25px auto; display: block; animation: bounceTulips 2s ease-in-out infinite alternate; }
        @keyframes bounceTulips { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(-8px) scale(1.03); } }
        .bottom-tag-container { display: inline-block; border: 4px solid #ea6b94; background-color: #ffffff; padding: 10px 20px; margin-top: 10px; box-shadow: 4px 4px 0px #ba486b; }
        .developer-text { color: #ea6b94; font-weight: bold; font-size: 1rem; }
    </style>
</head>
<body>
    <div id="bg-art"></div>
    <img src="cat.webp" class="bg-element bg-cat" alt="Animated Cute Cat">
    <img src="cherry.webp" class="bg-element bg-cherry" alt="Animated Cherry Blossom">
    <canvas id="confetti-canvas"></canvas>

    <div id="game-screen">
        <h2 id="level-title">Round 1 of 3: Easy Mode</h2>
        <div class="math-box" id="equation-display">5 + 7 = ?</div>
        <input type="number" id="answer-input" class="input-field" placeholder="Type answer here..." autocomplete="off">
        <button class="custom-submit-btn" id="action-btn" onclick="checkAnswer()">
            <img src="button.webp" alt="Submit Answer">
        </button>
        <div id="loading-container">
            <p class="loading-alert-text">Verifying response...</p>
            <div class="progress-bar-bg"><div id="progress-fill"></div><div id="progress-text">0%</div></div>
        </div>
    </div>

    <div id="crash-screen">
        <div class="bsod-title">CRITICAL_SYSTEM_ERROR</div>
        <p class="bsod-text">
            System exception 0x80070002. TOO CUTE BUT TOO FAR :( .<br><br>
            Diagnostic Code: <span style="color: #ea6b94; font-weight: bold;">SYSTEM_OVERLOADED_BY_CUTENESS_OVERLOAD</span>
        </p>
        <div class="bsod-btn-wrapper">
            <button class="custom-submit-btn" onclick="triggerReveal()">
                <img src="button.webp" alt="Override System Repair">
            </button>
        </div>
    </div>

    <div id="reveal-screen">
        <div class="window-header">
            <div class="header-decorations">
                <div class="decor-dot"></div>
                <div class="decor-dot"></div>
                <div class="decor-dot"></div>
            </div>
            <div class="close-button-x">X</div>
        </div>
        <div class="window-content">
            <div class="love-headline">I love you</div>
            <img src="bouquet.png" class="bouquet-frame" alt="Bouquet Artwork Asset">
            <div class="bottom-tag-container">
                <span class="developer-text"> The developer of this mini game loves you! ❤️</span>
            </div>
        </div>
    </div>
</body>
    <script>
        let currentRound = 1;
        const answers = { 1: 12, 2: 24 };

        function checkAnswer() {
            const inputField = document.getElementById('answer-input');
            const userAnswer = parseInt(inputField.value);

            if (currentRound === 1) {
                if (userAnswer === answers[1]) {
                    currentRound = 2;
                    document.getElementById('level-title').innerText = "Round 2 of 3: Two more to go";
                    document.getElementById('equation-display').innerText = "11 + 13 = ?";
                    inputField.value = "";
                } else {
                    alert("Incorrect! Give it another shot.");
                }
            } else if (currentRound === 2) {
                if (userAnswer === answers[2]) {
                    currentRound = 3;
                    document.getElementById('level-title').innerText = "Round 3 of 3: Final Round";
                    document.getElementById('equation-display').innerText = "143 + 256 = ?";
                    inputField.value = "";
                } else {
                    alert("Incorrect! Give it another shot.");
                }
            } else if (currentRound === 3) {
                inputField.style.display = "none";
                document.getElementById('action-btn').style.display = "none";
                
                const loadingContainer = document.getElementById('loading-container');
                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                loadingContainer.style.display = "block";

                let progressValue = 0;
                const interval = setInterval(() => {
                    progressValue += Math.floor(Math.random() * 12) + 6;
                    if (progressValue >= 99) {
                        progressValue = 99;
                        clearInterval(interval);
                        
                        setTimeout(() => {
                            document.querySelector('.bg-cat').style.display = "none";
                            document.querySelector('.bg-cherry').style.display = "none";
                            document.getElementById('bg-art').style.display = "none";
                            document.getElementById('game-screen').style.display = "none";
                            
                            const crashScreen = document.getElementById('crash-screen');
                            crashScreen.style.display = "flex";
                            document.body.style.backgroundColor = "#ffffff"; 
                        }, 1200);
                    }
                    progressFill.style.width = progressValue + "%";
                    progressText.innerText = progressValue + "%";
                }, 160);
            }
        }

        function triggerReveal() {
            document.getElementById('crash-screen').style.display = "none";
            document.body.style.background = "#ffdbe4"; 
            document.getElementById('reveal-screen').style.display = "block";
            
            initConfetti();
        }
        
        function initConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.style.display = 'block';

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const confettiCount = 135;
            const confettiPieces = [];
            const colors = ['#f7d6db', '#ebaebd', '#dd829a', '#ea6b94', '#ffffff', '#e2c2ff'];

            for (let i = 0; i < confettiCount; i++) {
                confettiPieces.push({
                    x: Math.random() * width,
                    y: Math.random() * height - height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * confettiCount,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.06 + 0.02,
                    tiltAngle: 0
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                confettiPieces.forEach((p, index) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle);
                    p.tilt = Math.sin(p.tiltAngle - index / 3) * 15;

                    if (p.y > height) {
                        confettiPieces[index] = {
                            x: Math.random() * width,
                            y: -20,
                            r: p.r,
                            d: p.d,
                            color: p.color,
                            tilt: p.tilt,
                            tiltAngleIncremental: p.tiltAngleIncremental,
                            tiltAngle: p.tiltAngle
                        };
                    }

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();
                });

                requestAnimationFrame(draw);
            }

            draw();
        }
    </script>
</body>
</html>
